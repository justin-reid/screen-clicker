name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Downloads all land in the same folder; without this every one of them is
      # screen-clicker-debug.zip and you cannot tell which commit you installed.
      - name: Identify this build
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      # Runners are fresh VMs with no ~/.android/debug.keystore, so AGP would mint a
      # random one per run and every build would be signed by a different key. Android
      # then refuses to update an installed app and reports only "App not installed".
      - name: Restore the shared debug signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_B64" ]; then
            echo "::error::DEBUG_KEYSTORE_B64 is not set. Without it this build would be signed with a throwaway key and could not be installed over an existing copy."
            exit 1
          fi
          printf '%s' "$DEBUG_KEYSTORE_B64" | base64 -d > debug.keystore
          test -s debug.keystore

      # The wrapper jar is not committed, so Gradle itself is pinned here instead.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      # The run number, so each published APK is a newer version than the last one, and the
      # short sha, so the installed app can be matched to the build it came from
      # (Settings -> Apps -> Screen Clicker -> version).
      - name: Unit tests
        run: gradle jacocoDebugUnitTestCoverageVerification -PversionCode=${{ github.run_number }} -PversionNameSuffix=-${{ env.SHORT_SHA }} --stacktrace

      - name: Assemble debug APK
        run: gradle assembleDebug -PversionCode=${{ github.run_number }} -PversionNameSuffix=-${{ env.SHORT_SHA }} --stacktrace

      # If this fingerprint ever changes, updates stop installing over an existing copy
      # and Android says only "App not installed". Print it so the cause is visible.
      - name: Report signing certificate
        run: |
          APK=$(ls app/build/outputs/apk/debug/*.apk | head -1)
          echo "Built $(basename "$APK")"
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "$APK" | head -1
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest'

      # Signed with the shared debug key restored above, so this is directly
      # sideloadable from the workflow run page.
      - uses: actions/upload-artifact@v5
        with:
          name: screen-clicker-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # The same app, built non-debuggable. This is a *measurement*, not a distribution
      # build: a debuggable APK runs app code without ART's optimizing compiler, and the
      # template matcher is a tight integer loop — the case that suffers most. The device
      # reports `match 5161ms` where the same search costs ~165ms on a laptop JVM, and the
      # build mode is the first candidate for that gap (see AGENTS.md). Install this beside
      # the debug copy, run the same script, and compare the `match` figure on the panel.
      - name: Assemble release APK
        run: gradle assembleRelease -PversionCode=${{ github.run_number }} -PversionNameSuffix=-${{ env.SHORT_SHA }} --stacktrace

      # Same check as the debug build, for the same reason: the fingerprint must match or
      # Android refuses to update over an installed copy with only "App not installed".
      - name: Report the release signing certificate
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          echo "Built $(basename "$APK")"
          AAPT2=$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$AAPT2" dump badging "$APK" | head -1
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | grep -i 'SHA-256 digest'

      - uses: actions/upload-artifact@v5
        with:
          name: screen-clicker-${{ env.SHORT_SHA }}-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
